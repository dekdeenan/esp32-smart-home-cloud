<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>ESP32 Smart Home</title>
  <style>
    :root{--bg:#07111f;--panel:#102139;--line:#29445f;--text:#edf7ff;--muted:#8da8bd;--green:#43df91;--red:#ff4d5d;--cyan:#42dafa}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 10% 0,#11345a,transparent 35%),var(--bg);color:var(--text);font-family:Tahoma,sans-serif}.app{width:min(94vw,920px);min-height:100dvh;margin:auto;padding:clamp(12px,2vh,22px);display:flex;flex-direction:column;justify-content:center}.title{text-align:center;margin:0;font-size:clamp(28px,4vw,43px)}.subtitle{text-align:center;margin:5px 0 13px;color:var(--muted)}.status{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.statusItem{display:flex;justify-content:center;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:13px}.dot{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}.dot.online{background:var(--green);box-shadow:0 0 10px var(--green)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:linear-gradient(145deg,#132740,#0d1b2d);border:1px solid var(--line);border-radius:16px;padding:14px}.sensor{text-align:center}.sensor strong{font-size:clamp(30px,5vw,42px);color:var(--cyan)}h2{font-size:20px;margin:12px 0 9px}.relay.on{border-color:#2ec57f}.head{display:flex;justify-content:space-between}.lamp{width:23px;height:23px;border-radius:50%;background:#33495e}.relay.on .lamp{background:var(--green);box-shadow:0 0 18px var(--green)}button{font:inherit;cursor:pointer}.switch{width:100%;border:0;border-radius:10px;padding:10px;margin-top:9px;background:#2c4054;color:#fff}.relay.on .switch{background:#19a866}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.all{border:0;border-radius:11px;padding:12px;color:#fff;font-weight:bold}.onBtn{background:#159c62}.offBtn{background:#d44b5c}.credit{text-align:center;color:var(--muted);font-size:14px;margin:11px 0 0}.login{position:fixed;inset:0;background:#07111fee;display:grid;place-items:center;padding:20px;z-index:5}.login.hidden{display:none}.loginBox{width:min(92vw,420px);background:#102139;border:1px solid var(--line);border-radius:20px;padding:24px;text-align:center}.loginBox input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#071521;color:#fff;margin:12px 0}.loginBox button{width:100%;padding:12px;border:0;border-radius:10px;background:#1979b8;color:#fff;font-weight:bold}.error{color:#ff91a0;min-height:22px}@media(max-width:540px){.app{width:96vw;justify-content:flex-start}.grid,.status{gap:8px}.card{padding:10px}}@media(max-height:720px){.app{justify-content:flex-start;padding-top:8px}.title{font-size:28px}.subtitle{margin:2px 0 7px}.statusItem{padding:6px}.card{padding:8px}.sensor strong{font-size:29px}h2{margin:7px 0}.switch,.all{padding:7px}.credit{margin-top:6px}}
    .app{position:relative}.logoutBtn{display:block;align-self:center;margin:8px auto 0;border:1px solid #496681;border-radius:9px;padding:7px 18px;background:#172d45;color:#edf7ff;font-size:14px}.logoutBtn:hover{background:#244766;border-color:#62b9e8}@media(max-width:700px){.logoutBtn{padding:6px 15px;font-size:12px}}
    .scheduleToggle{width:42px;height:42px;margin:9px auto 0;display:block;border:1px solid #4b7393;border-radius:50%;background:#17304a;color:#fff;font-size:19px}.scheduleToggle.active{background:#c78319;border-color:#ffc45e}.schedulePanel{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.schedulePanel.open{display:block}.scheduleRow{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;align-items:center;margin:6px 0}.scheduleRow input{min-width:0;width:100%;padding:7px;border:1px solid #3c5b76;border-radius:8px;background:#081725;color:#fff;color-scheme:dark}.scheduleActions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.saveSchedule,.cancelSchedule{border:0;border-radius:8px;padding:8px;color:#fff}.saveSchedule{background:#1979b8}.cancelSchedule{background:#8e3f4b}.countdown{min-height:35px;margin-top:7px;text-align:center;color:#ffd074;font-size:13px;line-height:1.35}
    /* ลดขนาดแถบลงครึ่งหนึ่ง และรักษาสัดส่วนให้พอดีกับหน้าจอ */
    @media (min-width:541px){
      .app{width:min(96vw,calc(15cm + 50px));min-height:100dvh;padding:12px 20px 18px;justify-content:flex-start}
      .title{margin-top:auto}
      .grid,.actions{grid-template-columns:repeat(2,minmax(0,7.5cm));justify-content:center}
      .sensor{height:min(2.25cm,14vh);text-align:left;display:block;padding-top:12px}
      #relays .relay{min-height:min(2.5cm,15vh);display:flex;flex-direction:column;justify-content:space-between}
      .actions .all{width:7.5cm;max-width:100%;height:min(1cm,7vh);padding:5px}
      .credit{margin-top:auto;margin-bottom:10px;padding-top:6px}
    }
  </style>
</head>
<body>
  <div class="login" id="login"><div class="loginBox"><h2>Dashboard</h2><p>ระบบ IoT Smart Home</p><input id="accessKey" type="password" placeholder="รหัสผ่านเข้าใช้งาน"><button id="loginBtn">เชื่อมต่อ</button><p class="error" id="loginError"></p><span style='font-size:14 px; color:#ffffff; opacity:0.3;'>@นายกฤษณะพงศ์ ศรีสุคนธ์</span></div></div>
  <main class="app">
    <h1 class="title">ESP32 Smart Home</h1><p class="subtitle">Blynk Cloud + Hosted Web Control</p>
    <div class="status"><div class="statusItem"><i class="dot" id="cloudDot"></i><span id="cloudStatus">Cloud: OFFLINE</span></div><div class="statusItem"><i class="dot" id="blynkDot"></i><span id="blynkStatus">Blynk: OFFLINE</span></div></div>
    <section class="grid"><div class="card sensor">อุณหภูมิ<br><strong id="t">--</strong> °C</div><div class="card sensor">ความชื้น<br><strong id="h">--</strong> %</div></section>
    <h2>ควบคุมรีเลย์</h2><section class="grid" id="relays"></section>
    <div class="actions"><button class="all onBtn" onclick="allRelay(true)">เปิดทั้งหมด</button><button class="all offBtn" onclick="allRelay(false)">ปิดทั้งหมด</button></div>
    <button class="logoutBtn" id="logoutBtn" type="button">ออกจากระบบ</button>
    <p class="credit">ออกแบบโดย @ นายกฤษณะพงศ์&nbsp;&nbsp;ศรีสุคนธ์</p>
  </main>
  <script>
    let state=[0,0,0,0],schedules=[null,null,null,null],key=sessionStorage.getItem('dashboardKey')||'';const box=document.querySelector('#relays'),openSchedules=new Set();
    const headers=()=>({'Content-Type':'application/json','X-Dashboard-Key':key});
    function dot(id,on){document.querySelector(id).classList.toggle('online',on)}
    function localParts(epoch){if(!epoch)return['',''];const d=new Date(epoch*1000),p=n=>String(n).padStart(2,'0');return[`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,`${p(d.getHours())}:${p(d.getMinutes())}`]}
    function draw(){box.innerHTML='';state.forEach((v,i)=>{const s=schedules[i],a=localParts(s?.start),b=localParts(s?.stop),e=document.createElement('div');e.className='card relay '+(v?'on':'');e.innerHTML=`<div class="head"><b>รีเลย์ ${i+1}</b><i class="lamp"></i></div><button class="switch">${v?'ปิด':'เปิด'}</button><button class="scheduleToggle ${s?'active':''}" title="ตั้งวันและเวลา">⏱</button><div class="countdown" id="count-${i}"></div><div class="schedulePanel ${openSchedules.has(i)?'open':''}"><div class="scheduleRow"><span>เปิด</span><input type="date" class="onDate" value="${a[0]}"><input type="time" class="onTime" value="${a[1]}"></div><div class="scheduleRow"><span>ปิด</span><input type="date" class="offDate" value="${b[0]}"><input type="time" class="offTime" value="${b[1]}"></div><div class="scheduleActions"><button class="saveSchedule">บันทึก</button><button class="cancelSchedule">ยกเลิกเวลา</button></div></div>`;e.querySelector('.switch').onclick=()=>relay(i+1,!v);e.querySelector('.scheduleToggle').onclick=()=>{openSchedules.has(i)?openSchedules.delete(i):openSchedules.add(i);e.querySelector('.schedulePanel').classList.toggle('open')};e.querySelector('.saveSchedule').onclick=()=>saveSchedule(i,e);e.querySelector('.cancelSchedule').onclick=()=>removeSchedule(i);box.appendChild(e)});updateCountdowns()}
    async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:headers(),body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(r.status===401)throw Error('รหัสผ่านไม่ถูกต้อง');if(!r.ok){if(d.error?.includes('DASHBOARD_KEY'))throw Error('ยังไม่ได้ตั้ง DASHBOARD_KEY ใน Worker Secret');if(d.error?.includes('BLYNK_TOKEN'))throw Error('ยังไม่ได้ตั้ง BLYNK_TOKEN ใน Worker Secret');throw Error(d.error||'ระบบ Cloud ไม่ตอบสนอง')}return d}
    async function relay(id,on){try{await api('/api/relay',{id,state:on?1:0});await load()}catch(e){alert(e.message)}}
    async function allRelay(on){try{await api('/api/all',{state:on?1:0});await load()}catch(e){alert(e.message)}}
    async function saveSchedule(i,card){const date1=card.querySelector('.onDate').value,time1=card.querySelector('.onTime').value,date2=card.querySelector('.offDate').value,time2=card.querySelector('.offTime').value;if(!date1||!time1||!date2||!time2)return alert('กรุณาเลือกวันและเวลาเปิด-ปิดให้ครบ');const start=Math.floor(new Date(`${date1}T${time1}:00`).getTime()/1000),stop=Math.floor(new Date(`${date2}T${time2}:00`).getTime()/1000);if(start<=Date.now()/1000||stop<=start)return alert('เวลาเปิดต้องอยู่ในอนาคต และเวลาปิดต้องหลังเวลาเปิด');try{await api('/api/schedule',{id:i+1,start,stop});openSchedules.delete(i);await load()}catch(e){alert(e.message)}}
    async function removeSchedule(i){try{await api('/api/schedule/cancel',{id:i+1});schedules[i]=null;openSchedules.delete(i);await load()}catch(e){alert(e.message)}}
    function duration(sec){sec=Math.max(0,Math.floor(sec));const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;return `${d?d+' วัน ':''}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
    function updateCountdowns(){const now=Date.now()/1000;schedules.forEach((x,i)=>{const e=document.querySelector(`#count-${i}`);if(!e)return;e.textContent=!x?'ยังไม่ได้ตั้งเวลา':now<x.start?`เปิดใน ${duration(x.start-now)}`:now<x.stop?`กำลังเปิด • ปิดใน ${duration(x.stop-now)}`:'กำลังอัปเดตสถานะ...'})}
    async function load(showError=false){try{const d=await api('/api/status');state=d.relays;schedules=d.schedules||[null,null,null,null];document.querySelector('#t').textContent=d.temperature??'--';document.querySelector('#h').textContent=d.humidity??'--';document.querySelector('#cloudStatus').textContent='Cloud: ONLINE';document.querySelector('#blynkStatus').textContent='Blynk: ONLINE';dot('#cloudDot',true);dot('#blynkDot',true);draw();return true}catch(e){document.querySelector('#cloudStatus').textContent='Cloud: OFFLINE';document.querySelector('#blynkStatus').textContent='Blynk: OFFLINE';dot('#cloudDot',false);dot('#blynkDot',false);if(showError)document.querySelector('#loginError').textContent=e.message;return false}}
    async function login(){key=document.querySelector('#accessKey').value.trim();if(!key)return;document.querySelector('#loginError').textContent='กำลังตรวจสอบ...';sessionStorage.setItem('dashboardKey',key);if(await load(true)){document.querySelector('#login').classList.add('hidden');document.querySelector('#loginError').textContent=''}}
    function logout(){sessionStorage.removeItem('dashboardKey');key='';document.querySelector('#accessKey').value='';document.querySelector('#loginError').textContent='';document.querySelector('#login').classList.remove('hidden');document.querySelector('#accessKey').focus()}
    document.querySelector('#logoutBtn').onclick=logout;document.querySelector('#loginBtn').onclick=login;document.querySelector('#accessKey').onkeydown=e=>{if(e.key==='Enter')login()};draw();if(key){document.querySelector('#accessKey').value=key;login()}setInterval(updateCountdowns,1000);setInterval(()=>{if(document.querySelector('#login').classList.contains('hidden')&&!['INPUT','BUTTON'].includes(document.activeElement.tagName))load()},10000);
  </script>
</body></html>
