<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020d1d"><title>ESP32 Smart Home</title>
<style>
:root{--bg:#020d1d;--panel:#071a34;--line:#294766;--text:#f4f8ff;--muted:#9db0c8;--cyan:#17d6ff;--green:#1cdf70;--red:#ff3949;--amber:#ffb51c}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 22%,#092243 0,#020d1d 55%,#010816 100%);color:var(--text);font-family:Tahoma,"Noto Sans Thai",sans-serif}body{padding:18px}.app{width:min(100%,1304px);margin:auto}.title{text-align:center;margin:0;font-size:clamp(38px,4vw,54px);line-height:1.05}.subtitle{text-align:center;margin:7px 0 14px;color:#aebbd0;font-size:clamp(18px,2vw,25px)}.status{display:flex;justify-content:center;gap:16px;margin-bottom:15px}.statusItem{height:42px;min-width:226px;border:1.5px solid var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--green);font-size:18px;font-weight:700;background:#031a20aa}.statusItem.offline{border-color:var(--red);color:#ff6673}.statusIcon{width:24px;height:24px}.sensorGrid,.relayGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.sensor{height:110px;display:flex;align-items:center;gap:24px;padding:17px 28px}.card{background:linear-gradient(145deg,#0b2342,#06172f 70%);border:1px solid var(--line);border-radius:10px;box-shadow:inset 0 1px 0 #ffffff09,0 14px 38px #0002}.roundIcon{width:67px;height:67px;border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;color:var(--cyan);flex:none}.roundIcon svg{width:36px;height:36px}.sensorLabel{font-size:18px;font-weight:700;margin-bottom:3px}.sensorValue{color:var(--cyan);font-size:40px;font-weight:700;line-height:1}.sensorValue small{font-size:24px;font-weight:500}.sectionTitle{display:flex;align-items:center;gap:42px;margin:13px 0 8px;color:var(--cyan);font-size:30px;font-weight:700;text-align:center}.sectionTitle:before,.sectionTitle:after{content:"";height:1px;background:#35506d;flex:1}.relay{min-height:282px;padding:13px 18px;transition:.2s}.relay.activeSchedule{border-color:var(--amber);box-shadow:0 0 0 1px #ffb51c22,0 14px 38px #0006}.relayTop{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.relayIdentity{display:flex;align-items:center;gap:14px}.plugIcon{width:54px;height:54px;border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;color:var(--cyan)}.plugIcon svg{width:29px;height:29px}.relayName{font-size:26px;font-weight:700}.relayControls{display:flex;align-items:center;gap:14px}.stateBtn{width:108px;height:49px;border-radius:7px;border:1.5px solid;color:#fff;font-size:20px;font-weight:700;cursor:pointer;transition:.15s}.stateBtn:active,.scheduleToggle:active{transform:translateY(1px)}.stateBtn:hover,.scheduleToggle:hover{filter:brightness(1.15)}.onBtn{background:linear-gradient(#22a84d,#158437);border-color:#20e866}.offBtn{background:linear-gradient(#e43d49,#bb2634);border-color:#ff5260}.stateBtn.selected{box-shadow:0 0 18px currentColor}.scheduleToggle{width:64px;height:64px;border-radius:50%;border:2px solid var(--amber);background:#251b08;color:var(--amber);display:grid;place-items:center;cursor:pointer}.scheduleToggle svg{width:36px;height:36px}.scheduleToggle.active{box-shadow:0 0 20px #ffb51c44;background:#3b2806}.countdown{height:31px;margin:9px 0 1px;display:flex;align-items:center;gap:8px;color:var(--amber);font-size:18px}.countdown svg{width:25px;height:25px}.v9Note{margin-left:auto;color:var(--muted);font-size:14px}.schedulePanel{display:none;border:1px solid #38536f;border-radius:6px;padding:10px;margin-top:2px;background:#07172d}.schedulePanel.open{display:block}.scheduleFields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.field label{display:block;font-size:14px;font-weight:700;margin:0 0 5px}.field input{width:100%;height:39px;border:1px solid #38536f;border-radius:5px;background:#0a1930;color:#fff;padding:6px 9px;font:inherit;color-scheme:dark}.scheduleActions{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:10px}.saveBtn,.cancelBtn{height:41px;border-radius:4px;color:#fff;font:inherit;font-weight:700;cursor:pointer}.saveBtn{background:linear-gradient(#ad7300,#845500);border:1px solid var(--amber)}.cancelBtn{background:#07172d;border:1px solid #68809a}.globalActions{display:flex;justify-content:center;gap:26px;margin:19px 0 8px}.globalBtn{width:294px;height:76px;border-radius:7px;border:1.5px solid;color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:15px;cursor:pointer}.globalBtn svg{width:36px;height:36px}.globalOn{background:linear-gradient(#209848,#147535);border-color:#20e866}.globalOff{background:linear-gradient(#d83b48,#ac2633);border-color:#ff5260}.logoutBtn{display:block;margin:10px auto;border:1px solid #496681;border-radius:8px;padding:7px 20px;background:#0c233c;color:#dce9f6;cursor:pointer}.credit{text-align:center;color:#66809b;font-size:13px}.login{position:fixed;inset:0;background:#020d1df5;display:grid;place-items:center;padding:20px;z-index:10}.login.hidden{display:none}.loginBox{width:min(92vw,420px);background:#0a203e;border:1px solid #355573;border-radius:15px;padding:25px;text-align:center;box-shadow:0 24px 80px #000b}.loginBox h2{margin:0 0 6px;color:var(--cyan)}.loginBox input{width:100%;height:45px;margin:14px 0;border:1px solid #466581;border-radius:7px;background:#05162b;color:#fff;padding:10px;font:inherit}.loginBox button{width:100%;height:44px;border:0;border-radius:7px;background:#1688bc;color:#fff;font-weight:700;font:inherit}.error{color:#ff7782;min-height:22px}.toast{position:fixed;right:18px;bottom:18px;max-width:360px;background:#0c2945;border:1px solid #3e6687;border-radius:9px;padding:12px 16px;box-shadow:0 12px 40px #0008;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1;transform:none}.toast.error{border-color:#d54a57;color:#ffd7dc}@media(max-width:900px){body{padding:12px}.sensorGrid,.relayGrid{grid-template-columns:1fr}.relay{min-height:auto}.scheduleFields{grid-template-columns:repeat(2,1fr)}.statusItem{min-width:0;flex:1}.sectionTitle{font-size:25px;gap:18px}}@media(max-width:560px){body{padding:9px}.title{font-size:32px}.subtitle{font-size:16px}.status{gap:7px}.statusItem{font-size:13px;height:38px}.sensor{height:91px;padding:12px 16px}.roundIcon{width:55px;height:55px}.sensorValue{font-size:31px}.sectionTitle{font-size:22px}.relay{padding:11px}.relayTop{grid-template-columns:1fr}.relayControls{justify-content:center;gap:8px}.stateBtn{width:88px;height:43px;font-size:17px}.scheduleToggle{width:54px;height:54px}.relayName{font-size:22px}.plugIcon{width:47px;height:47px}.scheduleFields{grid-template-columns:1fr 1fr;gap:8px}.field label{font-size:13px}.countdown{font-size:15px;flex-wrap:wrap;height:auto;min-height:31px}.v9Note{width:100%;margin:0}.globalActions{gap:9px}.globalBtn{height:58px;font-size:18px}.globalBtn svg{width:28px}.credit{font-size:12px}}
.subtitle{display:none}.v9Note{display:none}.scheduleFields>*{min-width:0}.field{min-width:0}.field input{min-width:0;max-width:100%;font-size:14px}@media(max-width:430px){.scheduleFields{grid-template-columns:1fr}.scheduleActions{grid-template-columns:1fr}.status{flex-direction:column}.globalActions{flex-direction:column;align-items:stretch}.globalBtn{width:100%}}</style></head><body>
<div class="login" id="login"><div class="loginBox"><h2>Dashboard</h2><p>ระบบ IoT Smart Home</p><input id="accessKey" type="password" placeholder="รหัสผ่านเข้าใช้งาน"><button id="loginBtn">เชื่อมต่อ</button><p class="error" id="loginError"></p></div></div>
<main class="app"><h1 class="title">ESP32 Smart Home</h1><p class="subtitle">Blynk Cloud + Hosted Web Control</p><div class="status"><div class="statusItem offline" id="cloudBox"><span id="cloudIcon"></span><span>Cloud: OFFLINE</span></div><div class="statusItem offline" id="blynkBox"><b>ⓑ</b><span>Blynk: OFFLINE</span></div></div><section class="sensorGrid"><article class="card sensor"><div class="roundIcon" id="tempIcon"></div><div><div class="sensorLabel">อุณหภูมิ</div><div class="sensorValue"><span id="t">--</span><small> °C</small></div></div></article><article class="card sensor"><div class="roundIcon" id="dropIcon"></div><div><div class="sensorLabel">ความชื้น</div><div class="sensorValue"><span id="h">--</span><small> %</small></div></div></article></section><div class="sectionTitle">ควบคุมรีเลย์</div><section class="relayGrid" id="relays"></section><div class="globalActions"><button class="globalBtn globalOn" onclick="allRelay(true)" id="allOn"></button><button class="globalBtn globalOff" onclick="allRelay(false)" id="allOff"></button></div><button class="logoutBtn" id="logoutBtn">ออกจากระบบ</button><p class="credit">ออกแบบโดย @ นายกฤษณะพงศ์&nbsp;&nbsp;ศรีสุคนธ์</p></main><div class="toast" id="toast"></div>
<script>
const ICON={cloud:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 19h12a4 4 0 0 0 .8-7.9A7 7 0 0 0 5.4 9.4 4.8 4.8 0 0 0 6 19Z"/></svg>',temp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 14.8V5a4 4 0 0 0-8 0v9.8a6 6 0 1 0 8 0Z"/><path d="M10 6v10"/></svg>',drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2S5 10 5 15a7 7 0 0 0 14 0c0-5-7-13-7-13Z"/></svg>',plug:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v5m8-5v5M6 7h12v4a6 6 0 0 1-12 0V7Zm6 10v5"/></svg>',calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 2v3m10-3v3M3 8h18M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><circle cx="16.5" cy="16.5" r="3.5"/><path d="M16.5 14.5v2l1.5 1"/></svg>',clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',power:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v10M6.3 5.7a8 8 0 1 0 11.4 0"/></svg>'};
let state=[0,0,0,0],schedules=[null,null,null,null],key=sessionStorage.getItem('dashboardKey')||'',openSchedules=new Set([0]),loading=false;const box=document.querySelector('#relays');const headers=()=>({'Content-Type':'application/json','X-Dashboard-Key':key});
function notify(message,error=false){const e=document.querySelector('#toast');e.textContent=message;e.className='toast show'+(error?' error':'');clearTimeout(notify.timer);notify.timer=setTimeout(()=>e.className='toast',2600)}function setStatus(id,on,text){const e=document.querySelector(id);e.classList.toggle('offline',!on);e.querySelector('span:last-child').textContent=text}function localParts(epoch){if(!epoch)return['',''];const d=new Date(epoch*1000),p=n=>String(n).padStart(2,'0');return[`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,`${p(d.getHours())}:${p(d.getMinutes())}`]}function duration(sec){sec=Math.max(0,Math.floor(sec));const d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60),s=sec%60;return`${d?d+' วัน ':''}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function draw(){box.innerHTML='';state.forEach((v,i)=>{const s=schedules[i],a=localParts(s?.start),b=localParts(s?.stop),e=document.createElement('article');e.className='card relay '+(s?'activeSchedule':'');e.innerHTML=`<div class="relayTop"><div class="relayIdentity"><div class="plugIcon">${ICON.plug}</div><div class="relayName">รีเลย์ ${i+1}</div></div><div class="relayControls"><button class="stateBtn onBtn ${v?'selected':''}">เปิด</button><button class="stateBtn offBtn ${!v?'selected':''}">ปิด</button><button class="scheduleToggle ${s?'active':''}">${ICON.calendar}</button></div></div><div class="countdown" id="count-${i}">${ICON.clock}<span>ยังไม่ได้ตั้งเวลา</span><small class="v9Note">ใช้ Blynk V9 ช่องเดียว</small></div><div class="schedulePanel ${openSchedules.has(i)?'open':''}"><div class="scheduleFields"><div class="field"><label>วันที่เปิด</label><input class="onDate" type="date" value="${a[0]}"></div><div class="field"><label>เวลาเปิด</label><input class="onTime" type="time" value="${a[1]}"></div><div class="field"><label>วันที่ปิด</label><input class="offDate" type="date" value="${b[0]}"></div><div class="field"><label>เวลาปิด</label><input class="offTime" type="time" value="${b[1]}"></div></div><div class="scheduleActions"><button class="saveBtn">บันทึก</button><button class="cancelBtn">ยกเลิกเวลา</button></div></div>`;e.querySelector('.onBtn').onclick=()=>relay(i+1,true);e.querySelector('.offBtn').onclick=()=>relay(i+1,false);e.querySelector('.scheduleToggle').onclick=()=>{openSchedules.has(i)?openSchedules.delete(i):openSchedules.add(i);e.querySelector('.schedulePanel').classList.toggle('open')};e.querySelector('.saveBtn').onclick=()=>saveSchedule(i,e);e.querySelector('.cancelBtn').onclick=()=>removeSchedule(i);box.appendChild(e)});updateCountdowns()}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:headers(),body:body?JSON.stringify(body):undefined}),d=await r.json().catch(()=>({}));if(r.status===401)throw Error('รหัสผ่านไม่ถูกต้อง');if(!r.ok)throw Error(d.error||'ระบบ Cloud ไม่ตอบสนอง');return d}async function relay(id,on){try{await api('/api/relay',{id,state:on?1:0});state[id-1]=on?1:0;draw();notify(`${on?'เปิด':'ปิด'}รีเลย์ ${id} แล้ว`);load()}catch(e){notify(e.message,true)}}async function allRelay(on){try{await api('/api/all',{state:on?1:0});state=state.map(()=>on?1:0);draw();notify(on?'เปิดรีเลย์ทั้งหมดแล้ว':'ปิดรีเลย์ทั้งหมดแล้ว');load()}catch(e){notify(e.message,true)}}
async function saveSchedule(i,c){const d1=c.querySelector('.onDate').value,t1=c.querySelector('.onTime').value,d2=c.querySelector('.offDate').value,t2=c.querySelector('.offTime').value;if(!d1||!t1||!d2||!t2)return notify('กรุณาเลือกวันและเวลาให้ครบ',true);const start=Math.floor(new Date(`${d1}T${t1}:00`).getTime()/1000),stop=Math.floor(new Date(`${d2}T${t2}:00`).getTime()/1000);if(start<=Date.now()/1000||stop<=start)return notify('เวลาเปิดต้องอยู่ในอนาคต และเวลาปิดต้องหลังเวลาเปิด',true);try{await api('/api/schedule',{id:i+1,start,stop});schedules[i]={start,stop};openSchedules.delete(i);draw();notify(`บันทึกเวลารีเลย์ ${i+1} แล้ว`);load()}catch(e){notify(e.message,true)}}async function removeSchedule(i){try{await api('/api/schedule/cancel',{id:i+1});schedules[i]=null;openSchedules.delete(i);draw();notify(`ยกเลิกเวลารีเลย์ ${i+1} แล้ว`);load()}catch(e){notify(e.message,true)}}function updateCountdowns(){const now=Date.now()/1000;schedules.forEach((x,i)=>{const e=document.querySelector(`#count-${i} span`);if(e)e.textContent=!x?'ยังไม่ได้ตั้งเวลา':now<x.start?`เปิดใน ${duration(x.start-now)}`:now<x.stop?`กำลังเปิด • ปิดใน ${duration(x.stop-now)}`:'กำลังอัปเดตสถานะ...'})}
async function load(showError=false){if(loading)return false;loading=true;try{const d=await api('/api/status');state=d.relays||state;schedules=d.schedules||schedules;document.querySelector('#t').textContent=d.temperature??'--';document.querySelector('#h').textContent=d.humidity??'--';setStatus('#cloudBox',true,'Cloud: ONLINE');setStatus('#blynkBox',true,'Blynk: ONLINE');draw();return true}catch(e){setStatus('#cloudBox',false,'Cloud: OFFLINE');setStatus('#blynkBox',false,'Blynk: OFFLINE');if(showError)document.querySelector('#loginError').textContent=e.message;return false}finally{loading=false}}async function login(){key=document.querySelector('#accessKey').value.trim();if(!key)return;document.querySelector('#loginError').textContent='กำลังตรวจสอบ...';sessionStorage.setItem('dashboardKey',key);if(await load(true)){document.querySelector('#login').classList.add('hidden');document.querySelector('#loginError').textContent=''}}function logout(){sessionStorage.removeItem('dashboardKey');key='';document.querySelector('#login').classList.remove('hidden')}

const THAI_MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];thaiDate=function(v){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||'');return m?`${+m[3]} ${THAI_MONTHS[+m[2]-1]} ${+m[1]+543}`:'เลือกวันที่'};thaiTime=function(v){if(!v)return'เลือกเวลา';const p=v.split(':'),h=p[0]=='00'?'24':p[0];return`${h}.${p[1]} น.`};decoratePicker=function(input,formatter,label){if(input.parentElement.classList.contains('pickerShell'))return;const shell=document.createElement('div'),display=document.createElement('span'),parent=input.parentNode;shell.className='pickerShell';display.className='pickerDisplay';display.textContent=formatter(input.value);parent.insertBefore(shell,input);shell.append(display,input);if(input.type==='date'){input.title='เลือกวันที่';input.setAttribute('aria-label','เลือกวันที่');const update=()=>display.textContent=thaiDate(input.value);input.addEventListener('input',update);input.addEventListener('change',update);return}input.title='เลือกเวลา';input.setAttribute('aria-label','เลือกเวลา');input.style.pointerEvents='none';const hit=document.createElement('button'),menu=document.createElement('div'),hour=document.createElement('select'),minute=document.createElement('select'),ok=document.createElement('button');hit.type='button';hit.className='timeHit';hit.title='เลือกเวลา';hit.setAttribute('aria-label','เลือกเวลา');menu.className='timeMenu';hour.title='ชั่วโมง';minute.title='นาที';for(let h=1;h<=24;h++)hour.add(new Option(String(h).padStart(2,'0'),String(h).padStart(2,'0')));for(let m=0;m<60;m++)minute.add(new Option(String(m).padStart(2,'0'),String(m).padStart(2,'0')));const parts=(input.value||'01:00').split(':');hour.value=parts[0]=='00'?'24':parts[0];minute.value=parts[1]||'00';ok.type='button';ok.textContent='ตกลง';menu.append(hour,minute,ok);shell.append(hit,menu);hit.onclick=e=>{e.stopPropagation();menu.classList.toggle('open')};ok.onclick=()=>{const h=hour.value,m=minute.v
